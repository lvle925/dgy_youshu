services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - youshu_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    environment:
      MYSQL_DATABASE: youshu
      MYSQL_USER: ${MYSQL_USER:-youshu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/youshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-youshu}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      APP_AUTH_DEMO_LOGIN_ENABLED: ${APP_AUTH_DEMO_LOGIN_ENABLED:-true}
      APP_AUTH_DEMO_PHONE: ${APP_AUTH_DEMO_PHONE:-127127}
      APP_AUTH_DEMO_SMS_CODE: ${APP_AUTH_DEMO_SMS_CODE:-127127}
      APP_AUTH_DEVICE_VERIFICATION_ENABLED: ${APP_AUTH_DEVICE_VERIFICATION_ENABLED:-true}
      APP_AUTH_TURNSTILE_SITE_KEY: ${APP_AUTH_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      APP_AUTH_TURNSTILE_SECRET_KEY: ${APP_AUTH_TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      MAP_PROVIDER: ${MAP_PROVIDER:-tencent}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      TENCENT_MAP_SECRET_KEY: ${TENCENT_MAP_SECRET_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5199}:80"
    depends_on:
      - api

volumes:
  youshu_mysql_data:
