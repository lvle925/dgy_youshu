services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - youshu_mysql_data:/var/lib/mysql
      - ./backend/sql/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    environment:
      MYSQL_DATABASE: youshu
      MYSQL_USER: ${MYSQL_USER:-youshu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-youshu_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-youshu_root_local}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/youshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-youshu}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-youshu_local}
      APP_AUTH_DEMO_LOGIN_ENABLED: ${APP_AUTH_DEMO_LOGIN_ENABLED:-true}
      APP_AUTH_DEMO_PHONE: "127127"
      APP_AUTH_DEMO_SMS_CODE: "127127"
      APP_AUTH_DEVICE_VERIFICATION_ENABLED: "true"
      APP_AUTH_TURNSTILE_SITE_KEY: ${APP_AUTH_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      APP_AUTH_TURNSTILE_SECRET_KEY: ${APP_AUTH_TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      TENCENT_MAP_SECRET_KEY: ${TENCENT_MAP_SECRET_KEY:-}

  mysql-test:
    image: mysql:8.4
    profiles: ["test"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3308:3306"
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_DATABASE: youshu_test
      MYSQL_USER: youshu_test
      MYSQL_PASSWORD: youshu_test_password
      MYSQL_ROOT_PASSWORD: youshu_test_root_password
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend-test:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./backend:/app
    command: mvn -q clean test
    environment:
      TEST_MYSQL_URL: jdbc:mysql://mysql-test:3306/youshu_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      TEST_MYSQL_USERNAME: youshu_test
      TEST_MYSQL_PASSWORD: youshu_test_password
    depends_on:
      mysql-test:
        condition: service_healthy

volumes:
  youshu_mysql_data:
