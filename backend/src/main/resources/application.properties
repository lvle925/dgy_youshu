server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/youshu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:youshu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:youshu_local}
spring.sql.init.mode=always
server.error.include-message=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
springdoc.swagger-ui.enabled=false
app.auth.demo-login-enabled=${APP_AUTH_DEMO_LOGIN_ENABLED:false}
app.auth.demo-phone=${APP_AUTH_DEMO_PHONE:127127}
app.auth.demo-sms-code=${APP_AUTH_DEMO_SMS_CODE:127127}
app.auth.device-verification-enabled=${APP_AUTH_DEVICE_VERIFICATION_ENABLED:false}
app.auth.turnstile-site-key=${APP_AUTH_TURNSTILE_SITE_KEY:}
app.auth.turnstile-secret-key=${APP_AUTH_TURNSTILE_SECRET_KEY:}
app.tencentmap.key=${TENCENT_MAP_KEY:}
app.tencentmap.secret-key=${TENCENT_MAP_SECRET_KEY:}
