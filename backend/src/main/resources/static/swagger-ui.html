<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>有数计划 API 文档</title>
    <link rel="stylesheet" href="/webjars/swagger-ui/swagger-ui.css" />
    <style>
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *::before, *::after { box-sizing: inherit; }
      body { margin: 0; background: #f5f4f0; }
      .swagger-ui .topbar { background: #34312d; }
      .swagger-ui .topbar-wrapper .link span { visibility: hidden; position: relative; }
      .swagger-ui .topbar-wrapper .link span::after { content: "有数计划 API"; visibility: visible; position: absolute; left: 0; color: #faf8f3; font-size: 16px; font-weight: 600; white-space: nowrap; }
      .swagger-ui .information-container { padding: 16px 0; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="/webjars/swagger-ui/swagger-ui-bundle.js"></script>
    <script src="/webjars/swagger-ui/swagger-ui-standalone-preset.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "/v3/api-docs",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        layout: "StandaloneLayout",
      });
    </script>
  </body>
</html>
